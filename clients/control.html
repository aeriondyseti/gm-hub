<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keys to Perfection — DM Control</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #1a1209 0%, #0f0b06 100%);
    font-family: 'Cormorant Garamond', serif; color: #e8d5a3;
  }

  /* ── Layout (portrait 1080×1920) ── */
  .layout { display: flex; flex-direction: column; width: 100%; height: 100%; }
  .preview-area {
    flex-shrink: 0; display: flex; align-items: center; justify-content: flex-start;
    padding: 10px 20px; height: 28%; gap: 16px;
  }
  .preview-frame {
    height: 100%; flex-shrink: 0;
    aspect-ratio: 16 / 9; position: relative;
    background: linear-gradient(135deg, #1a1712 0%, #0d0b08 100%);
    box-shadow: 0 0 40px rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden;
  }
  .preview-mood {
    display: flex; flex-direction: column; gap: 8px; align-self: stretch;
    justify-content: center; flex: 1; min-width: 0;
  }
  .preview-mood .label { margin-bottom: 0; }
  .preview-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; color: #3a3020; font-style: italic; letter-spacing: 2px;
    opacity: 0.3; text-align: center; line-height: 1.8; pointer-events: none; z-index: 1;
  }
  .panel-area {
    flex: 1; width: 100%;
    background: linear-gradient(180deg, #1a1209 0%, #0f0b06 100%);
    border-top: 2px solid #6b5a3e; padding: 18px 24px;
    overflow-y: auto;
  }

  /* ── Typography ── */
  .heading {
    font-family: 'Cinzel Decorative', serif; font-size: 16px; color: #c4a265;
    letter-spacing: 2px; text-transform: uppercase; text-align: center; margin-bottom: 6px;
  }
  .label {
    font-family: 'Cinzel', serif; font-size: 13px; color: #a8924f;
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; display: block;
  }
  .sublabel {
    font-family: 'Cinzel', serif; font-size: 11px; color: #8c7b68;
    letter-spacing: 1.2px; text-transform: uppercase; margin-top: 6px; margin-bottom: 5px;
  }
  .status-text {
    font-size: 13px; color: #8c7b68; letter-spacing: 0.5px; margin-top: 8px;
  }

  /* ── Section ── */
  .section {
    margin-bottom: 16px; padding: 16px;
    background: rgba(42, 35, 24, 0.5); border-radius: 6px; border: 1px solid #6b5a3e;
  }

  /* ── Inputs ── */
  input[type="text"], textarea {
    font-family: 'Cormorant Garamond', serif; font-size: 18px;
    padding: 10px 12px; background: #2a2318; border: 1px solid #7a6548;
    border-radius: 4px; color: #e8d5a3; width: 100%; outline: none;
  }
  textarea { resize: vertical; min-height: 48px; max-height: 120px; font-size: 16px; line-height: 1.4; }
  input[type="text"]:focus, textarea:focus { border-color: #a8924f; }

  /* ── Buttons ── */
  .btn {
    font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 1px;
    padding: 12px 20px; background: transparent; border: 1px solid #8b7441;
    border-radius: 4px; color: #a8924f; cursor: pointer;
    transition: all 0.2s ease; text-transform: uppercase;
  }
  .btn:hover { background: rgba(139, 116, 65, 0.15); }
  .btn.active { background: #8b7441; color: #1a1209; }
  .btn.danger { border-color: #d4603a; color: #d4603a; }
  .btn.danger:hover { background: rgba(139, 37, 0, 0.15); }
  .btn.gold { border-color: #c4a265; color: #c4a265; }
  .btn.gold:hover { background: rgba(196, 162, 101, 0.15); }
  .btn.gold.active { background: #c4a265; color: #1a1209; }
  .btn.muted { border-color: #6b5a3e; color: #8c7b68; cursor: default; }
  .btn-sm { padding: 8px 10px; font-size: 12px; }
  .btn-icon {
    width: 32px; height: 32px; background: transparent; border: 1px solid #6b5a3e;
    border-radius: 4px; color: #8c7b68; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease; flex-shrink: 0; padding: 0;
  }
  .btn-icon:hover { border-color: #d4603a; color: #d4603a; }

  /* ── Presets ── */
  .preset-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .preset-row { display: flex; gap: 5px; align-items: stretch; }
  .preset-btn {
    flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 15px;
    padding: 10px 12px; text-align: left; cursor: pointer;
    background: rgba(26, 18, 9, 0.4); border: 1px solid #6b5a3e;
    border-radius: 4px; color: #e8d5a3; transition: all 0.15s ease; line-height: 1.3;
  }
  .preset-btn:hover { border-color: #8c7b68; }
  .preset-btn.active { background: rgba(139, 116, 65, 0.15); border-color: #a8924f; }
  .preset-btn .preset-name {
    font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.8px;
  }
  .preset-btn .preset-sub { color: #a08c6a; font-style: italic; font-size: 13px; }

  /* ── Mood Grid ── */
  .mood-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }

  /* ── Lore Queue ── */
  .lore-queue {
    max-height: 200px; overflow-y: auto; margin-bottom: 10px;
    border-radius: 4px; border: 1px solid #6b5a3e; background: rgba(15, 11, 6, 0.4);
  }
  .lore-queue-empty {
    font-size: 14px; color: #8c7b68; font-style: italic; padding: 12px; text-align: center;
  }
  .lore-queue-item {
    display: flex; gap: 6px; align-items: flex-start;
    padding: 8px 10px; border-bottom: 1px solid #2a2318;
  }
  .lore-queue-item:first-child { background: rgba(139, 116, 65, 0.08); }
  .lore-queue-item .lore-idx {
    font-family: 'Cinzel', serif; font-size: 11px; color: #8c7b68;
    min-width: 18px; padding-top: 2px; flex-shrink: 0;
  }
  .lore-queue-item .lore-text {
    font-size: 14px; font-style: italic; line-height: 1.4; flex: 1;
  }
  .lore-queue-item:first-child .lore-text { color: #d4c4a0; }
  .lore-queue-item .lore-text { color: #a89878; }
  .lore-queue-rm {
    background: transparent; border: none; color: #8c7b68; cursor: pointer;
    font-size: 14px; padding: 0 4px; flex-shrink: 0; line-height: 1;
  }
  .lore-queue-rm:hover { color: #d4603a; }

  /* ── Add preset form ── */
  .add-form { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .add-form-row { display: flex; gap: 4px; }

  /* ── Divider ── */
  .divider { display: flex; justify-content: center; margin-bottom: 10px; }

  /* ── Status bar ── */
  .status-bar { display: flex; justify-content: space-between; }

  /* ── Preview overlay elements (mirrors overlay.html) ── */
  .pv-frame { position: absolute; inset: 0; overflow: hidden; }
  .pv-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    transition: box-shadow 2s ease;
  }
  .pv-border-outer {
    position: absolute; inset: 0; pointer-events: none; z-index: 10;
    border-radius: 1px; transition: border-color 2s ease; opacity: 0.4;
  }
  .pv-border-inner {
    position: absolute; inset: 4px; pointer-events: none; z-index: 10;
    border-radius: 1px; transition: border-color 2s ease; opacity: 0.2;
  }
  .pv-corner { position: absolute; z-index: 15; width: 80px; height: 80px; }
  .pv-corner-tl { top: 2px; left: 2px; }
  .pv-corner-tr { top: 2px; right: 2px; transform: scaleX(-1); }
  .pv-corner-bl { bottom: 2px; left: 2px; transform: scaleY(-1); }
  .pv-corner-br { bottom: 2px; right: 2px; transform: scale(-1,-1); }

  .pv-scene {
    position: absolute; top: 10px; left: 50%; z-index: 20;
    transform: translate(-50%, -100%); opacity: 0; pointer-events: none;
  }
  .pv-scene.visible { animation: pvSlideIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
  .pv-scene.hiding { animation: pvSlideOut 0.5s ease-in forwards; }
  .pv-scene-card {
    background: radial-gradient(ellipse at 20% 50%, rgba(139,116,65,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(101,78,40,0.06) 0%, transparent 40%),
      linear-gradient(180deg, #f4e8c1 0%, #e8d5a3 30%, #dcc48e 70%, #d4b978 100%);
    padding: 10px 36px 8px; border-radius: 2px; border: 1.5px solid #8b7441;
    box-shadow: 0 3px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    text-align: center; position: relative; min-width: 200px;
  }
  .pv-scene-accent {
    position: absolute; top: -1px; left: 20%; right: 20%; height: 2px;
    background: linear-gradient(90deg, transparent, #8b7441, transparent);
  }
  .pv-scene-loc {
    font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700;
    color: #3d2b1f; letter-spacing: 2.5px; text-transform: uppercase;
    line-height: 1.2; text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  .pv-scene-sub {
    font-family: 'Cormorant Garamond', serif; font-size: 12px; font-weight: 500;
    font-style: italic; color: #8c7b68; margin-top: 2px; letter-spacing: 0.8px;
  }

  .pv-npc {
    position: absolute; bottom: 28px; left: 50%; z-index: 20;
    transform: translate(-50%, 15px); opacity: 0; pointer-events: none;
  }
  .pv-npc.visible { animation: pvFadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
  .pv-npc.hiding { animation: pvFadeDown 0.4s ease-in forwards; }
  .pv-npc-card {
    background: linear-gradient(135deg, #2a1f14 0%, #1a1209 100%);
    padding: 8px 32px 7px; border-radius: 2px;
    border: 1px solid #8b7441; border-bottom: 2.5px solid #c4a265;
    box-shadow: 0 3px 14px rgba(0,0,0,0.5); text-align: center; min-width: 180px;
  }
  .pv-npc-name {
    font-family: 'Cinzel', serif; font-size: 15px; font-weight: 600;
    color: #e8d5a3; letter-spacing: 2px; text-transform: uppercase;
  }
  .pv-npc-title {
    font-family: 'Cormorant Garamond', serif; font-size: 11px; font-weight: 400;
    font-style: italic; color: #a08c6a; margin-top: 1px; letter-spacing: 0.8px;
  }

  .pv-lore-feed {
    position: absolute; top: 90px; right: 14px; z-index: 20;
    width: 280px; max-height: calc(100% - 140px);
    display: flex; flex-direction: column; align-items: flex-end;
    pointer-events: none; overflow: hidden;
  }
  .pv-lore-entry {
    background: linear-gradient(135deg, rgba(26,18,9,0.85) 0%, rgba(15,11,6,0.9) 100%);
    border-right: 2px solid #8b7441; border-radius: 2px;
    padding: 6px 10px; margin-bottom: 6px; max-width: 100%;
    animation: pvLoreFeedIn 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    transition: opacity 0.8s ease;
  }
  .pv-lore-text {
    font-family: 'Cormorant Garamond', serif; font-size: 12px; font-weight: 400;
    font-style: italic; color: #d4c4a0; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    line-height: 1.45; letter-spacing: 0.3px; text-align: right;
  }

  .pv-session {
    position: absolute; bottom: 7px; left: 88px; z-index: 20;
    display: flex; align-items: center; gap: 8px; opacity: 0.6;
  }
  .pv-session-campaign {
    font-family: 'Cinzel Decorative', serif; font-size: 9px; font-weight: 400;
    color: #c4a265; letter-spacing: 1.5px; text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .pv-session-dot { width: 2.5px; height: 2.5px; border-radius: 50%; background: #8b7441; }
  .pv-session-num {
    font-family: 'Cormorant Garamond', serif; font-size: 10px; font-weight: 500;
    color: #a08c6a; letter-spacing: 0.8px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .pv-mood-dot {
    position: absolute; bottom: 9px; right: 14px; z-index: 20; opacity: 0.45;
    width: 5px; height: 5px; border-radius: 50%;
    animation: pvBorderPulse 3s ease-in-out infinite;
  }

  @keyframes pvSlideIn { from { transform: translate(-50%,-100%); opacity:0; } to { transform: translate(-50%,0); opacity:1; } }
  @keyframes pvSlideOut { from { transform: translate(-50%,0); opacity:1; } to { transform: translate(-50%,-100%); opacity:0; } }
  @keyframes pvFadeUp { from { transform: translate(-50%,15px); opacity:0; } to { transform: translate(-50%,0); opacity:1; } }
  @keyframes pvFadeDown { from { transform: translate(-50%,0); opacity:1; } to { transform: translate(-50%,10px); opacity:0; } }
  @keyframes pvLoreFeedIn { from { transform:translateY(-8px); opacity:0; max-height:0; margin-bottom:0; padding:0 10px; } to { transform:translateY(0); opacity:1; max-height:80px; margin-bottom:6px; padding:6px 10px; } }
  @keyframes pvBorderPulse { 0%,100% { opacity:0.35; } 50% { opacity:0.65; } }
</style>
</head>
<body>

<div class="layout">
  <!-- ═══ Preview ═══ -->
  <div class="preview-area">
    <div class="preview-frame" id="preview">
      <video id="pv-camera" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;display:none;"></video>
      <div class="preview-label" id="pv-label">Live Preview</div>
      <div class="pv-frame" id="pv-frame">
        <div class="pv-vignette" id="pv-vignette"></div>
        <div class="pv-border-outer" id="pv-border-outer"></div>
        <div class="pv-border-inner" id="pv-border-inner"></div>

        <svg class="pv-corner pv-corner-tl" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#8b7441" stroke-width="1.2" opacity="0.55"><path d="M8,72 Q8,8 72,8"/><path d="M16,72 Q16,16 72,16"/><path d="M8,72 L8,54 Q8,40 22,40 L40,40 Q54,40 54,26 L54,8"/><circle cx="8" cy="72" r="3" fill="#8b7441"/><circle cx="72" cy="8" r="2.5" fill="#8b7441"/><circle cx="30" cy="40" r="1.5" fill="#8b7441"/><path d="M20,60 Q16,50 28,46" stroke-width="0.8"/><path d="M46,20 Q50,16 60,14" stroke-width="0.8"/></g></svg>
        <svg class="pv-corner pv-corner-tr" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#8b7441" stroke-width="1.2" opacity="0.55"><path d="M8,72 Q8,8 72,8"/><path d="M16,72 Q16,16 72,16"/><path d="M8,72 L8,54 Q8,40 22,40 L40,40 Q54,40 54,26 L54,8"/><circle cx="8" cy="72" r="3" fill="#8b7441"/><circle cx="72" cy="8" r="2.5" fill="#8b7441"/><circle cx="30" cy="40" r="1.5" fill="#8b7441"/><path d="M20,60 Q16,50 28,46" stroke-width="0.8"/><path d="M46,20 Q50,16 60,14" stroke-width="0.8"/></g></svg>
        <svg class="pv-corner pv-corner-bl" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#8b7441" stroke-width="1.2" opacity="0.55"><path d="M8,72 Q8,8 72,8"/><path d="M16,72 Q16,16 72,16"/><path d="M8,72 L8,54 Q8,40 22,40 L40,40 Q54,40 54,26 L54,8"/><circle cx="8" cy="72" r="3" fill="#8b7441"/><circle cx="72" cy="8" r="2.5" fill="#8b7441"/><circle cx="30" cy="40" r="1.5" fill="#8b7441"/><path d="M20,60 Q16,50 28,46" stroke-width="0.8"/><path d="M46,20 Q50,16 60,14" stroke-width="0.8"/></g></svg>
        <svg class="pv-corner pv-corner-br" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#8b7441" stroke-width="1.2" opacity="0.55"><path d="M8,72 Q8,8 72,8"/><path d="M16,72 Q16,16 72,16"/><path d="M8,72 L8,54 Q8,40 22,40 L40,40 Q54,40 54,26 L54,8"/><circle cx="8" cy="72" r="3" fill="#8b7441"/><circle cx="72" cy="8" r="2.5" fill="#8b7441"/><circle cx="30" cy="40" r="1.5" fill="#8b7441"/><path d="M20,60 Q16,50 28,46" stroke-width="0.8"/><path d="M46,20 Q50,16 60,14" stroke-width="0.8"/></g></svg>

        <div class="pv-scene" id="pv-scene">
          <div class="pv-scene-card"><div class="pv-scene-accent"></div>
            <div class="pv-scene-loc" id="pv-scene-loc"></div>
            <div class="pv-scene-sub" id="pv-scene-sub"></div>
          </div>
        </div>
        <div class="pv-npc" id="pv-npc">
          <div class="pv-npc-card">
            <div class="pv-npc-name" id="pv-npc-name"></div>
            <div class="pv-npc-title" id="pv-npc-title"></div>
          </div>
        </div>
        <div class="pv-lore-feed" id="pv-lore-feed"></div>
        <div class="pv-session">
          <span class="pv-session-campaign">Keys to Perfection</span>
          <span class="pv-session-dot"></span>
          <span class="pv-session-num" id="pv-session-num"></span>
        </div>
        <div class="pv-mood-dot" id="pv-mood-dot"></div>
      </div>
    </div>
    <div class="preview-mood" style="overflow-y:auto;">
      <label class="label">Session #</label>
      <input type="text" id="session-num" style="width:100px">
      <label class="label" style="margin-top:8px">Mood</label>
      <div class="mood-grid" id="mood-grid"></div>
      <button class="btn btn-sm" id="btn-camera" style="margin-top:8px;flex-shrink:0" onclick="toggleCamera()">OBS Camera</button>
    </div>
  </div>

  <!-- ═══ Control Panel ═══ -->
  <div class="panel-area" id="panel">
    <div class="heading">DM Control</div>
    <div class="divider">
      <svg viewBox="0 0 300 20" width="200" height="12" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#8b7441" stroke-width="1" opacity="0.45"><line x1="40" y1="10" x2="260" y2="10"/><circle cx="150" cy="10" r="2.5" fill="#8b7441"/><circle cx="133" cy="10" r="1.2" fill="#8b7441"/><circle cx="167" cy="10" r="1.2" fill="#8b7441"/><path d="M40,10 L48,5.5 L52,10 L48,14.5 Z" fill="#8b7441"/><path d="M260,10 L252,5.5 L248,10 L252,14.5 Z" fill="#8b7441"/></g></svg>
    </div>

    <!-- Location -->
    <div class="section">
      <label class="label">Location</label>
      <div class="preset-list" id="loc-presets"></div>
      <div style="height:8px"></div>
      <button class="btn" id="btn-scene" style="width:100%">Show Scene</button>
      <div class="sublabel">Custom / Edit</div>
      <input type="text" id="loc-name" placeholder="Location">
      <div style="height:4px"></div>
      <input type="text" id="loc-sub" placeholder="Subtitle" style="font-size:16px">
      <div style="height:4px"></div>
      <input type="text" id="loc-foundry" placeholder="Foundry scene name (optional)" style="font-size:13px;color:#a08c6a;font-style:italic">
      <div style="height:6px"></div>
      <button class="btn btn-sm" id="btn-loc-add" title="Save as preset">+ Save</button>
    </div>

    <!-- NPC -->
    <div class="section">
      <label class="label">NPC Nameplate</label>
      <div class="preset-list" id="npc-presets"></div>
      <div style="height:8px"></div>
      <button class="btn" id="btn-npc" style="width:100%">Show NPC</button>
      <div class="sublabel">Custom / Edit</div>
      <input type="text" id="npc-name" placeholder="Name">
      <div style="height:4px"></div>
      <input type="text" id="npc-title" placeholder="Title" style="font-size:16px">
      <div style="height:4px"></div>
      <input type="text" id="npc-foundry" placeholder="Foundry lookup name (optional)" style="font-size:13px;color:#a08c6a;font-style:italic">
      <div style="height:6px"></div>
      <button class="btn btn-sm" id="btn-npc-add" title="Save as preset">+ Save</button>
    </div>

    <!-- Lore Queue -->
    <div class="section">
      <label class="label">Lore / Quest Feed</label>
      <div class="lore-queue" id="lore-queue"></div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button class="btn gold" id="btn-push-lore" style="flex:1">Push Next</button>
        <button class="btn danger" id="btn-clear-lore">Clear Feed</button>
      </div>
      <div style="display:flex;gap:4px">
        <textarea id="lore-input" placeholder="Add lore, quest note, flavor text..."></textarea>
        <button class="btn" id="btn-add-lore" style="align-self:flex-end;padding:6px 10px">Add</button>
      </div>
      <div class="status-text status-bar">
        <span id="lore-queued-count">5 queued</span>
        <span id="lore-screen-count">0 on screen</span>
      </div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// State & Config
// ═══════════════════════════════════════════════════════════
const MOODS = {
  neutral:    { color: '#c4a265', glow: 'rgba(196, 162, 101, 0.12)', label: 'Neutral' },
  tense:      { color: '#8b2500', glow: 'rgba(139, 37, 0, 0.15)', label: 'Tense' },
  mysterious: { color: '#4a3472', glow: 'rgba(74, 52, 114, 0.15)', label: 'Mysterious' },
  festive:    { color: '#b8860b', glow: 'rgba(184, 134, 11, 0.18)', label: 'Festive' },
  somber:     { color: '#2f4f4f', glow: 'rgba(47, 79, 79, 0.15)', label: 'Somber' },
  dangerous:  { color: '#8b0000', glow: 'rgba(139, 0, 0, 0.18)', label: 'Dangerous' },
};

let state = {
  sceneVisible: false, sceneLocation: '', sceneSubtitle: '',
  npcVisible: false, npcName: '', npcTitle: '',
  mood: 'neutral', loreFeed: [], loreNextId: 0, session: '',
};

let npcPresets = [];
let locPresets = [];
let loreQueue = [];

function savePresets() {
  fetch('/api/presets', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ npcs: npcPresets, locations: locPresets, lore: loreQueue }),
  }).catch(() => {});
}

// Load presets from server
fetch('/api/presets').then(r => r.json()).then(data => {
  if (data.npcs) { npcPresets = data.npcs; renderNpcPresets(); }
  if (data.locations) { locPresets = data.locations; renderLocPresets(); }
  if (data.lore) { loreQueue = data.lore; renderLoreQueue(); }
}).catch(() => {});

// ═══════════════════════════════════════════════════════════
// WebSocket connection
// ═══════════════════════════════════════════════════════════
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state-update' && msg.state) {
        // Sync state from server (e.g. on initial connect)
        Object.assign(state, msg.state);
        renderPreview();
        renderMoodGrid();
        renderLoreQueue();
        $('btn-scene').textContent = state.sceneVisible ? 'Hide Scene' : 'Show Scene';
        $('btn-scene').classList.toggle('active', state.sceneVisible);
        $('btn-npc').textContent = state.npcVisible ? 'Hide NPC' : 'Show NPC';
        $('btn-npc').classList.toggle('active', state.npcVisible);
        $('session-num').value = state.session || '';
      }
    } catch (err) {
      console.error('WS parse error:', err);
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onerror = () => ws.close();
}
connect();

function broadcast() {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'update-state', state: { ...state } }));
  }
}
function wsPushLore(text) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'push-lore', text }));
  }
}
function wsClearLore() {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'clear-lore' }));
  }
}

// ═══════════════════════════════════════════════════════════
// DOM Helpers
// ═══════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
function esc(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

// ═══════════════════════════════════════════════════════════
// Preview Rendering
// ═══════════════════════════════════════════════════════════
let prevPvState = {};
let pvLoreEntries = [];

function togglePv(el, visible, prevVisible) {
  if (visible === prevVisible) return;
  if (visible) {
    el.classList.remove('hiding'); void el.offsetWidth; el.classList.add('visible');
  } else {
    el.classList.remove('visible'); el.classList.add('hiding');
    el.addEventListener('animationend', () => { if (!el.classList.contains('visible')) el.classList.remove('hiding'); }, { once: true });
  }
}

function renderPreview() {
  const mood = MOODS[state.mood] || MOODS.neutral;
  $('pv-vignette').style.boxShadow = `inset 0 0 120px 40px ${mood.glow}`;
  $('pv-border-outer').style.border = `2px solid ${mood.color}`;
  $('pv-border-inner').style.border = `1px solid ${mood.color}`;
  $('pv-mood-dot').style.background = mood.color;
  $('pv-mood-dot').style.boxShadow = `0 0 6px ${mood.color}`;

  $('pv-scene-loc').textContent = state.sceneLocation || '';
  $('pv-scene-sub').textContent = state.sceneSubtitle || '';
  $('pv-scene-sub').style.display = state.sceneSubtitle ? 'block' : 'none';
  togglePv($('pv-scene'), state.sceneVisible, prevPvState.sceneVisible);

  $('pv-npc-name').textContent = state.npcName || '';
  $('pv-npc-title').textContent = state.npcTitle || '';
  $('pv-npc-title').style.display = state.npcTitle ? 'block' : 'none';
  togglePv($('pv-npc'), state.npcVisible, prevPvState.npcVisible);

  $('pv-session-num').textContent = state.session ? `Session ${state.session}` : '';

  // Lore feed in preview
  const feed = $('pv-lore-feed');
  if (state.loreFeed.length !== pvLoreEntries.length) {
    const existingIds = new Set(pvLoreEntries.map(e => e.id));
    const newEntries = state.loreFeed.filter(e => !existingIds.has(e.id));
    pvLoreEntries = [...state.loreFeed];
    if (state.loreFeed.length === 0) {
      feed.innerHTML = '';
    } else {
      newEntries.forEach(entry => {
        const div = document.createElement('div');
        div.className = 'pv-lore-entry';
        div.innerHTML = `<div class="pv-lore-text">"${esc(entry.text)}"</div>`;
        feed.appendChild(div);
      });
      while (feed.children.length > 6) feed.removeChild(feed.firstChild);
      Array.from(feed.children).forEach((child, i, arr) => {
        child.style.opacity = Math.max(0.3, 1 - (arr.length - 1 - i) * 0.2);
      });
    }
  }

  prevPvState = { ...state };
}

// ═══════════════════════════════════════════════════════════
// Control Panel Rendering
// ═══════════════════════════════════════════════════════════
function renderPresets(containerId, presets, labelKey, subKey, onSelect, onRemove) {
  const container = $(containerId);
  container.innerHTML = '';
  presets.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'preset-row';

    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    const sub = [item[subKey], item.foundryName ? `[${item.foundryName}]` : ''].filter(Boolean).join(' ');
    btn.innerHTML = `<span class="preset-name">${esc(item[labelKey])}</span>` +
      (sub ? `<br><span class="preset-sub">${esc(sub)}</span>` : '');
    btn.onclick = () => onSelect(item);
    row.appendChild(btn);

    const rm = document.createElement('button');
    rm.className = 'btn-icon';
    rm.textContent = '×';
    rm.title = 'Remove';
    rm.onclick = () => onRemove(i);
    row.appendChild(rm);

    container.appendChild(row);
  });
}

function renderNpcPresets() {
  renderPresets('npc-presets', npcPresets, 'name', 'title',
    (npc) => {
      if ($('npc-name').value === npc.name && $('npc-title').value === (npc.title || '')) {
        $('npc-name').value = ''; $('npc-title').value = ''; $('npc-foundry').value = '';
      } else {
        $('npc-name').value = npc.name; $('npc-title').value = npc.title || '';
        $('npc-foundry').value = npc.foundryName || '';
      }
      highlightPresets();
    },
    (i) => { npcPresets.splice(i, 1); renderNpcPresets(); savePresets(); }
  );
  highlightPresets();
}

function renderLocPresets() {
  renderPresets('loc-presets', locPresets, 'name', 'subtitle',
    (loc) => {
      if ($('loc-name').value === loc.name && $('loc-sub').value === (loc.subtitle || '')) {
        $('loc-name').value = ''; $('loc-sub').value = ''; $('loc-foundry').value = '';
      } else {
        $('loc-name').value = loc.name; $('loc-sub').value = loc.subtitle || '';
        $('loc-foundry').value = loc.foundryScene || '';
      }
      highlightPresets();
    },
    (i) => { locPresets.splice(i, 1); renderLocPresets(); savePresets(); }
  );
  highlightPresets();
}

function highlightPresets() {
  const nName = $('npc-name').value, nTitle = $('npc-title').value;
  document.querySelectorAll('#npc-presets .preset-btn').forEach((btn, i) => {
    btn.classList.toggle('active', npcPresets[i] && npcPresets[i].name === nName && npcPresets[i].title === nTitle);
  });
  const lName = $('loc-name').value, lSub = $('loc-sub').value;
  document.querySelectorAll('#loc-presets .preset-btn').forEach((btn, i) => {
    btn.classList.toggle('active', locPresets[i] && locPresets[i].name === lName && (locPresets[i].subtitle || '') === lSub);
  });
}

function renderLoreQueue() {
  const container = $('lore-queue');
  if (loreQueue.length === 0) {
    container.innerHTML = '<div class="lore-queue-empty">Queue empty \u2014 add entries below</div>';
  } else {
    container.innerHTML = loreQueue.map((text, i) =>
      `<div class="lore-queue-item">
        <span class="lore-idx">${i + 1}</span>
        <span class="lore-text">${esc(text)}</span>
        <button class="lore-queue-rm" data-idx="${i}" title="Remove">\u00d7</button>
      </div>`
    ).join('');
    container.querySelectorAll('.lore-queue-rm').forEach(btn => {
      btn.onclick = () => { loreQueue.splice(parseInt(btn.dataset.idx), 1); renderLoreQueue(); savePresets(); };
    });
  }
  $('lore-queued-count').textContent = `${loreQueue.length} queued`;
  $('lore-screen-count').textContent = `${state.loreFeed.length} on screen`;

  const pushBtn = $('btn-push-lore');
  if (loreQueue.length > 0) {
    pushBtn.classList.remove('muted'); pushBtn.classList.add('gold');
  } else {
    pushBtn.classList.remove('gold'); pushBtn.classList.add('muted');
  }
}

function renderMoodGrid() {
  const grid = $('mood-grid');
  grid.innerHTML = Object.entries(MOODS).map(([key, m]) =>
    `<button class="btn btn-sm ${state.mood === key ? 'active' : ''}"
      data-mood="${key}"
      style="border-color:${m.color};color:${state.mood === key ? '#1a1209' : m.color};background:${state.mood === key ? m.color : 'transparent'}"
    >${m.label}</button>`
  ).join('');
  grid.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { state.mood = btn.dataset.mood; update(); };
  });
}

// ═══════════════════════════════════════════════════════════
// State Update Cycle
// ═══════════════════════════════════════════════════════════
function update() {
  broadcast();
  renderPreview();
  renderMoodGrid();
  renderLoreQueue();

  // Button labels
  $('btn-scene').textContent = state.sceneVisible ? 'Hide Scene' : 'Show Scene';
  $('btn-scene').classList.toggle('active', state.sceneVisible);
  $('btn-npc').textContent = state.npcVisible ? 'Hide NPC' : 'Show NPC';
  $('btn-npc').classList.toggle('active', state.npcVisible);
}

// ═══════════════════════════════════════════════════════════
// Event Bindings
// ═══════════════════════════════════════════════════════════

// Scene
$('btn-scene').onclick = () => {
  state.sceneLocation = $('loc-name').value;
  state.sceneSubtitle = $('loc-sub').value;
  state.sceneVisible = !state.sceneVisible;
  update();
};
$('btn-loc-add').onclick = () => {
  const name = $('loc-name').value.trim();
  if (!name) return;
  const loc = { name, subtitle: $('loc-sub').value.trim() };
  const foundryScene = $('loc-foundry').value.trim();
  if (foundryScene) loc.foundryScene = foundryScene;
  locPresets.push(loc);
  renderLocPresets();
  savePresets();
};

// NPC
$('btn-npc').onclick = () => {
  state.npcName = $('npc-name').value;
  state.npcTitle = $('npc-title').value;
  state.npcVisible = !state.npcVisible;
  update();
};
$('btn-npc-add').onclick = () => {
  const name = $('npc-name').value.trim();
  if (!name) return;
  const npc = { name, title: $('npc-title').value.trim() };
  const foundryName = $('npc-foundry').value.trim();
  if (foundryName) npc.foundryName = foundryName;
  npcPresets.push(npc);
  renderNpcPresets();
  savePresets();
};

// Lore
$('btn-push-lore').onclick = () => {
  if (loreQueue.length === 0) return;
  const text = loreQueue.shift();
  wsPushLore(text);
  renderLoreQueue();
  savePresets();
};
$('btn-clear-lore').onclick = () => {
  wsClearLore();
  pvLoreEntries = [];
  $('pv-lore-feed').innerHTML = '';
  renderLoreQueue();
};
$('btn-add-lore').onclick = () => {
  const text = $('lore-input').value.trim();
  if (!text) return;
  loreQueue.push(text);
  $('lore-input').value = '';
  renderLoreQueue();
  savePresets();
};
$('lore-input').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    $('btn-add-lore').click();
  }
};

// Session
$('session-num').oninput = () => {
  state.session = $('session-num').value;
  update();
};

// OBS Camera toggle
let cameraStream = null;
let cameraActive = false;

async function toggleCamera() {
  const video = $('pv-camera');
  const overlay = $('pv-frame');
  const label = $('pv-label');
  const btn = $('btn-camera');

  if (cameraActive) {
    // Switch back to overlay preview
    if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
    video.style.display = 'none';
    overlay.style.display = '';
    label.style.display = '';
    btn.classList.remove('active');
    cameraActive = false;
    return;
  }

  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === 'videoinput');
    const obs = cameras.find(d => d.label.toLowerCase().includes('obs')) || cameras[cameras.length - 1];
    if (!obs) { alert('No camera devices found'); return; }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: obs.deviceId }, width: 1920, height: 1080 }
    });
    video.srcObject = cameraStream;
    video.style.display = 'block';
    overlay.style.display = 'none';
    label.style.display = 'none';
    btn.classList.add('active');
    cameraActive = true;
  } catch (e) {
    alert('Camera access failed: ' + e.message);
  }
}

// Highlight presets on input change
$('npc-name').oninput = highlightPresets;
$('npc-title').oninput = highlightPresets;
$('loc-name').oninput = highlightPresets;
$('loc-sub').oninput = highlightPresets;

// ═══════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════
renderNpcPresets();
renderLocPresets();
renderMoodGrid();
renderLoreQueue();
renderPreview();
update();
</script>
</body>
</html>
